<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0C0B10"><meta name="description" content="Catálogo de filmes e séries com sorteio e lista pessoal."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ver hoje"><meta name="apple-mobile-web-app-status-bar-style" content="black"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>O que vamos ver hoje?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Conceito: sala de cinema à noite. Fundo quase preto puxado pro ameixa, capas só de letreiro,
   cada uma tingida pela cor do gênero; vermelho-poltrona como destaque. Quatro telas: Início, Buscar, Sortear, Nossa lista. */
:root{
  --bg:#0C0B10; --surface:#16141C; --surface-2:#211E29; --line:#2E2A38; --ink:#F3F0F7; --ink-2:#A6A1B3; --ink-3:#77728A;
  --accent:#E5404E; --accent-ink:#FFFFFF; --accent-soft:rgba(229,64,78,.16); --imdb:#F5C518; --imdb-ink:#121212; --ok:#4CC38A;
  --scrim:rgba(4,3,8,.72);
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);padding-block:0;padding-left:var(--gut-l);padding-right:var(--gut-r)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:linear-gradient(var(--bg) 78%,rgba(12,11,16,0));padding:12px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;border:0;background:none;padding:0;text-align:left}
.brand b{font:400 27px/1 var(--display);letter-spacing:.02em;white-space:nowrap}
.brand b i{font-style:normal;color:var(--accent)}
.brand small{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:26px}
.note{font-size:12px;color:var(--ink-3)}
.banner{padding:10px 12px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:13px}

/* destaque */
.hero{position:relative;border-radius:22px;overflow:hidden;padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--g) 55%,transparent),transparent 60%),
  linear-gradient(160deg,color-mix(in srgb,var(--g) 30%,var(--surface)) 0%,var(--surface) 70%);border:1px solid color-mix(in srgb,var(--g) 35%,var(--line))}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.eyebrow em{font-style:normal;color:var(--accent)}
.hero h1{margin:0;font:400 clamp(40px,11vw,68px)/.92 var(--display);letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere}
.hero .orig{margin-top:-4px;color:var(--ink-2);font-size:14px;font-style:italic}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-2)}
.meta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3)}
.imdb{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;color:var(--ink);white-space:nowrap}
.imdb::before{content:"IMDb";background:var(--imdb);color:var(--imdb-ink);font-weight:800;font-size:10px;letter-spacing:.02em;padding:2px 5px;border-radius:4px}
.hero p.sin{margin:0;max-width:60ch;color:var(--ink);opacity:.9}
.cred{margin:0;display:flex;flex-direction:column;gap:6px;max-width:60ch;position:relative;z-index:1}
.cred div{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:baseline}
.cred dt{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.cred dd{margin:0;font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.on{background:var(--ok);border-color:transparent;color:#0B1A12}
.btn.ghost{background:transparent}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.5}

/* fileiras */
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-h h2{margin:0;font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.sec-h h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--g,var(--accent))}
.sec-h h2 small{font-size:12px;font-weight:500;color:var(--ink-3)}
.link{border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:600;padding:8px 0;white-space:nowrap}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 136px;scroll-snap-align:start}

/* capa tipográfica */
.card{position:relative;display:flex;flex-direction:column;gap:6px;aspect-ratio:2/3;max-width:100%;padding:10px 10px 10px;border-radius:14px;text-align:left;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--g) 30%,var(--line));
  background:linear-gradient(165deg,color-mix(in srgb,var(--g) 46%,#121017) 0%,color-mix(in srgb,var(--g) 14%,#121017) 55%,#100E15 100%)}
.card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px);pointer-events:none}
.card.off{opacity:.45}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;min-height:18px}
.c-gen{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.badge{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;white-space:nowrap}
.badge.ok{background:var(--ok);color:#0B1A12}
.c-t{margin-top:auto;font:400 25px/.95 var(--display);letter-spacing:.01em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.c-t.sm{font-size:21px}
.c-t.xs{font-size:17.5px}
.c-o{font-size:11px;font-style:italic;color:rgba(255,255,255,.66);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-f{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10.5px;color:rgba(255,255,255,.72);padding-top:6px;border-top:1px solid rgba(255,255,255,.12)}
.c-f .imdb{font-size:11px}
.c-f .imdb::before{font-size:8.5px;padding:1px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}

/* busca e filtros */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.search svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:13px 0;font-size:16px;outline:none}
.fgroup{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--g)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:600}
.chip.g[aria-pressed="true"]{background:var(--g);color:#fff}
.chip.g[aria-pressed="true"] i{background:#fff}
.count{font-size:13px;color:var(--ink-2)}
.more{align-self:center}
.addbox{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:16px;border:1px dashed var(--line);border-radius:16px;background:var(--surface)}
.addbox b{font-size:15px}
.addbox span{font-size:13px;color:var(--ink-2)}

/* sorteio */
.dice{display:flex;flex-direction:column;gap:18px;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.dice .btn.primary{min-height:56px;font-size:17px}
.empty{padding:28px 18px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:16px}

/* nossa lista */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:44px;font-size:13px;font-weight:600;color:var(--ink-2);padding:0 4px;line-height:1.15}
.seg button small{display:block;font-size:11px;font-weight:500;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.stats div{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.stats div:first-child{border-left:0}
.stats b{display:block;font:400 30px/1 var(--display)}
.stats span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.lrow{display:grid;grid-template-columns:5px 1fr auto;gap:12px;align-items:center;padding:10px 12px 10px 0;border-top:1px solid var(--line);min-height:62px;cursor:pointer}
.lrow:first-child{border-top:0}
.lrow .stripe{align-self:stretch;background:var(--g)}
.lrow .main{min-width:0}
.lrow .main b{display:block;font-weight:600;overflow-wrap:anywhere}
.lrow .main small{display:block;font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.lrow .side{display:flex;align-items:center;gap:8px}
.mini{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:13px;white-space:nowrap}
.mini.acc{background:var(--accent);color:#fff;border-color:transparent}
.sharebtn{width:100%}
.nota{font:400 22px/1 var(--display);color:var(--imdb);white-space:nowrap}
.nota small{font:600 11px var(--sans);color:var(--ink-3)}

/* navegação */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(18,16,23,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--ink-3);font-size:11px;font-weight:600;min-height:52px;border-radius:12px}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke:var(--accent)}

/* ficha */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:0 0 calc(18px + env(safe-area-inset-bottom,0px))}
.ph{position:relative;padding:14px max(18px,env(safe-area-inset-left,0px)) 18px max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(170deg,color-mix(in srgb,var(--g) 42%,var(--surface)) 0%,var(--bg) 100%)}
.grab{width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 6px}
.x{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.35);font-size:22px;line-height:1}
.ph h2{margin:0;padding-right:40px;font:400 42px/.95 var(--display);overflow-wrap:anywhere;text-wrap:balance}
.pb{padding:16px max(18px,env(safe-area-inset-left,0px)) 0 max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.pb p{margin:0}
.stbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.stbtns button{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.stbtns button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.stbtns button[data-st="visto"][aria-pressed="true"]{background:var(--ok);color:#0B1A12}
.stbtns button[data-st="quero"][aria-pressed="true"]{background:var(--accent);color:#fff}
.notas{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.notas button{min-height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:0}
.notas button.in{background:color-mix(in srgb,var(--imdb) 22%,var(--surface));border-color:color-mix(in srgb,var(--imdb) 40%,var(--line))}
.notas button[aria-pressed="true"]{background:var(--imdb);color:var(--imdb-ink);border-color:transparent}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.step span{font-size:12px;color:var(--ink-3);padding-left:6px}
.step b{font:400 26px/1 var(--display);min-width:28px;text-align:center}
.step button{width:38px;height:38px;border-radius:9px;border:0;background:var(--surface-2);font-size:20px;font-weight:600}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.fine{font-size:12px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.addres{display:flex;flex-direction:column;gap:12px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.thinking i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){
  .panel{animation:up .22s ease-out}.scrim{animation:fade .22s ease-out}
  @keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
@media (min-width:760px){
  .rail .card{flex-basis:160px}
  .c-t{font-size:28px}.c-t.sm{font-size:24px}.c-t.xs{font-size:20px}
  .hero{padding:32px 30px 28px}
  .sheet{align-items:center}.panel{border-radius:22px;border-bottom:1px solid var(--line);max-height:88%}
}
</style>

<script src="instalar.js" data-cor="#E5404E" defer></script>

    <button class="icon-btn" data-go="buscar" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Seções"><div class="tabs-in">

  <button class="tab" data-go="lista"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>Nossa lista</button>
</div></nav>

  o.id=slug(o.or)+"-"+o.ano+"-"+o.tipo; o.k=norm(o.pt+" | "+o.or+" | "+o.dir+" | "+o.elenco.join(" | ")); o.difOr=norm(o.or)!==norm(o.pt); return o;
}
var BASE=RAW.filter(function(r){return r&&r[3]!=="x";}).map(function(r){return mk(r);});

  sheet:null,add:null};

var nf1=new Intl.NumberFormat("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
function imdbTxt(t){return t.imdb?nf1.format(t.imdb):"–";}
function durTxt(t){if(t.tipo==="s")return t.dur?(t.dur+(t.dur===1?" temporada":" temporadas")):"Série";if(!t.dur)return "";var h=Math.floor(t.dur/60),m=t.dur%60;return h?(h+"h"+(m?String(m).padStart(2,"0"):"")):(m+" min");}
function gList(t){return t.g.split("").filter(function(c){return G[c];});}
function gNames(t){return gList(t).map(function(c){return G[c][0];});}
function gMain(t){var l=gList(t);for(var i=0;i<l.length;i++)if(MAIN.indexOf(l[i])>=0)return l[i];return l[0]||"D";}
function gColor(t){return (G[gMain(t)]||G.D)[1];}
function mark(id){return state.marks[id]||{};}
function st(id){return (state.marks[id]||{}).s||"";}
function byNota(a,b){return (b.imdb-a.imdb)||(b.ano-a.ano);}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function hoje(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function shuffleDia(arr,salt){var s=hoje()+salt;return arr.map(function(t){return [hash(s+t.id),t];}).sort(function(a,b){return a[0]-b[0];}).map(function(x){return x[1];});}

function badge(t){var s=st(t.id),m=mark(t.id);
  if(s==="visto")return '<span class="badge ok">✓ Vimos'+(m.nota?' · '+m.nota:'')+'</span>';
  if(s==="quero")return '<span class="badge">Na lista</span>';

  return "";}
function card(t){var L=t.pt.length,d=durTxt(t);
  return '<button class="card'+(st(t.id)==="nao"?' off':'')+'" data-open="'+t.id+'" style="--g:'+gColor(t)+'" aria-label="'+esc(t.pt+", "+t.ano)+'">'+
    '<span class="c-top"><span class="c-gen">'+esc(G[gMain(t)][0])+(t.tipo==="s"?' · série':'')+'</span>'+badge(t)+'</span>'+
    '<span class="c-t'+(L>34?' xs':(L>18?' sm':''))+'">'+esc(t.pt)+'</span>'+
    (t.difOr?'<span class="c-o">'+esc(t.or)+'</span>':'')+

  if(pool.length<3){pool=ALL.filter(function(t){var s=st(t.id);return s!=="visto"&&s!=="nao"&&s!=="assistindo"&&t.imdb>=7.4;});fonte="do catálogo";}

  pool.sort(function(a,b){return a.id<b.id?-1:1;});

function railSec(titulo,arr,more,cor){

function vInicio(){
  var p=pickSug(),h=heroHTML(p.t,'Sugestão de hoje <em>·</em> '+p.fonte,'<button class="btn" data-act="outra"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg>Outra</button>');

/* ---------- busca ---------- */
function chip(attr,val,label,on,cor){return '<button class="chip'+(cor?' g':'')+'" '+attr+'="'+esc(val)+'" aria-pressed="'+(on?'true':'false')+'"'+(cor?' style="--g:'+cor+'"':'')+'>'+(cor?'<i></i>':'')+esc(label)+'</button>';}
function filtrar(b){
  var q=norm(b.q),words=q?q.split(/\s+/):[];
  var r=ALL.filter(function(t){
    if(b.tipo&&t.tipo!==b.tipo)return false;
    if(b.gen.length){var ok=false;for(var i=0;i<b.gen.length;i++)if(t.g.indexOf(b.gen[i])>=0)ok=true;if(!ok)return false;}
    if(b.esconder){var s=st(t.id);if(s==="visto"||s==="nao")return false;}
    for(var j=0;j<words.length;j++)if(t.k.indexOf(words[j])<0)return false;
    return true;});
  if(b.ord==="ano")r.sort(function(a,c){return (c.ano-a.ano)||(c.imdb-a.imdb);});
  else if(b.ord==="az")r.sort(function(a,c){return a.pt.localeCompare(c.pt,"pt-BR");});
  else r.sort(byNota);
  return r;}

  h+='<div class="fgroup"><span class="flabel">Gênero</span><div class="chips">'+FILTRO.map(function(g){return chip("data-bg",g,G[g][0],b.gen.indexOf(g)>=0,G[g][1]);}).join("")+'</div></div>';
  h+='<div class="fgroup"><span class="flabel">Ordem</span><div class="chips">'+chip("data-bo","nota","Maior nota",b.ord==="nota")+chip("data-bo","ano","Mais novos",b.ord==="ano")+chip("data-bo","az","A–Z",b.ord==="az")+chip("data-bh","1","Esconder os que já vimos",b.esconder)+'</div></div>';

/* ---------- sortear ---------- */
function candidatos(){
  var o=state.sorte;
  return ALL.filter(function(t){
    var s=st(t.id);
    if(o.origem==="lista"){if(s!=="quero"&&s!=="assistindo")return false;}else if(s==="visto"||s==="nao")return false;
    if(o.tipo&&t.tipo!==o.tipo)return false;
    if(o.gen.length){var ok=false;for(var i=0;i<o.gen.length;i++)if(t.g.indexOf(o.gen[i])>=0)ok=true;if(!ok)return false;}
    if(o.dur&&(t.tipo!=="f"||!t.dur||t.dur>Number(o.dur)))return false;
    if(o.nota&&t.imdb<o.nota)return false;
    return true;});}

function sortear(){

  render();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}

function copiar(txt){

  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast("Lista copiada. É só colar na conversa.");},function(){toast(velho()?"Lista copiada. É só colar na conversa.":"Não consegui copiar a lista.");});
  else toast(velho()?"Lista copiada. É só colar na conversa.":"Não consegui copiar a lista.");}

  if(t.tipo==="s"&&(s==="assistindo"||s==="quero"||m.temp)){
    h+='<div class="fgroup"><span class="flabel">Onde paramos</span><div class="prog">'+
      '<div class="step"><span>Temporada</span><button data-tp="-1" aria-label="Temporada anterior">−</button><b>'+(m.temp||1)+'</b><button data-tp="1" aria-label="Próxima temporada">+</button></div>'+
      '<div class="step"><span>Episódio</span><button data-epd="-1" aria-label="Episódio anterior">−</button><b>'+(m.ep||1)+'</b><button data-epd="1" aria-label="Próximo episódio">+</button></div>'+
      '</div></div>';}
  h+='<div class="fgroup"><span class="flabel">Nossa nota'+(m.nota?' · '+m.nota:'')+'</span><div class="notas">';
  for(var i=1;i<=10;i++)h+='<button data-nota="'+i+'" aria-pressed="'+(m.nota===i)+'" class="'+(m.nota&&i<m.nota?'in':'')+'" aria-label="Nota '+i+'">'+i+'</button>';
  h+='</div></div>';
  h+='<label class="fgroup"><span class="flabel">Onde assistir (opcional)</span><input class="field" id="onde-'+t.id+'" data-onde value="'+esc(m.onde||"")+'" placeholder="Ex.: Netflix, Prime, Max" maxlength="60" autocomplete="off"></label>';
  h+='<p class="fine">Nota do IMDb aproximada, pode variar um pouco do site.'+(t.extra?' Adicionado por vocês com o Claude.':'')+'</p>';
  if(t.extra)h+='<button class="btn ghost" data-act="rmextra" style="color:var(--accent)">Tirar do catálogo</button>';
  h+='</div>';
  return h;}
function addHTML(){
  var a=state.add,h='<div class="ph" style="--g:var(--accent)"><div class="grab"></div><button class="x" data-close aria-label="Fechar">×</button><span class="eyebrow">Adicionar ao catálogo</span><h2>Filme ou série novo</h2></div><div class="pb">';
  h+='<label class="fgroup"><span class="flabel">Nome do filme ou série</span><input class="field" id="addq" value="'+esc(a.q)+'" placeholder="Ex.: Hereditário, The Bear, Coringa 2" autocomplete="off"></label>';
  if(a.fase==="pensando")h+='<div class="thinking"><i></i>Procurando com o Claude…</div>';
  else h+='<button class="btn primary" data-act="addgo">Procurar com o Claude</button>';
  if(a.erro)h+='<p class="banner" style="margin:0">'+esc(a.erro)+'</p>';
  if(a.res){var t=a.res;h+='<div class="addres"><span class="flabel">Encontrado</span>'+card(t).replace('data-open="'+t.id+'"','data-x')+'<p style="margin:0">'+esc(t.sin)+'</p>'+creditsHTML(t)+
    (BYID[t.id]?'<p class="banner" style="margin:0">Esse título já está no catálogo.</p><button class="btn" data-open="'+t.id+'">Abrir</button>':'<button class="btn primary" data-act="addsave">Salvar no catálogo</button>')+'</div>';}
  h+='<p class="fine">O Claude preenche com o que sabe. Lançamentos muito recentes podem vir com nota ou duração aproximada. Na primeira vez, o app pede permissão para usar o Claude.</p></div>';
  return h;}
function openSheet(id){state.add=null;state.sheet=id;drawSheet();}
function openAdd(q){state.sheet=null;state.add={q:q||"",fase:"",res:null,erro:""};drawSheet();setTimeout(function(){var i=$("#addq");if(i&&!q)i.focus();},60);}
function closeSheet(){state.sheet=null;state.add=null;$("#sheet").hidden=true;document.body.style.overflow="";}
function drawSheet(){
  var el=$("#sheet"),p=$("#panel");
  if(state.add){p.innerHTML=addHTML();}
  else if(state.sheet&&BYID[state.sheet]){var top=p.scrollTop;p.innerHTML=sheetHTML(BYID[state.sheet]);p.scrollTop=top;}
  else{closeSheet();return;}
  if(el.hidden){el.hidden=false;document.body.style.overflow="hidden";p.scrollTop=0;}
}

/* ---------- gravação ---------- */
var db=null,fila={};
function vazio(m){return !m||(!m.s&&!m.nota&&!m.onde&&!m.temp&&!m.ep);}
function setMark(id,patch){
  var m=Object.assign({},state.marks[id]||{},patch);
  if("s" in patch)m.at=new Date().toISOString();
  Object.keys(m).forEach(function(k){if(m[k]===""||m[k]==null||m[k]===0)delete m[k];});
  if(vazio(m))delete state.marks[id];else state.marks[id]=m;
  render();if(state.sheet===id)drawSheet();
  gravar(id);}
function gravar(id){
  if(!db){salvarLocal();return;}
  var ref=db.collection("marcas").doc(id);
  fila[id]=(fila[id]||Promise.resolve()).then(function(){var m=state.marks[id];return vazio(m)?ref.delete():ref.set(m);})
    .catch(function(e){toast(e&&e.code==="quota_exceeded"?"Espaço cheio. Tirem alguns itens das listas.":"Não consegui salvar. Confiram a internet.");});}
function salvarLocal(){try{localStorage.setItem("oqvvh-marcas",JSON.stringify(state.marks));localStorage.setItem("oqvvh-extras",JSON.stringify(state.extras.map(extraDoc)));}catch(e){}}
function carregarLocal(){try{var m=JSON.parse(localStorage.getItem("oqvvh-marcas")||"{}");if(m&&typeof m==="object")state.marks=m;var x=JSON.parse(localStorage.getItem("oqvvh-extras")||"[]");if(Array.isArray(x))state.extras=x.map(docExtra);}catch(e){}rebuild();}
function extraDoc(t){return {pt:t.pt,or:t.or,ano:t.ano,tipo:t.tipo,g:t.g,dur:t.dur,imdb:t.imdb,sin:t.sin,dir:t.dir||"",elenco:t.elenco||[],criado:t.criado||new Date().toISOString()};}
function docExtra(x){var t=mk([x.pt,x.or,x.ano,x.tipo,x.g,x.dur,x.imdb,x.sin,x.dir,x.elenco],true);t.criado=x.criado;return t;}
function iniciar(){
  var timer=setTimeout(function(){if(!state.loaded){state.slow=true;render();}},10000);
  var use=window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null);
  Promise.resolve(use).then(function(d){
    db=d||null;
    if(!db){clearTimeout(timer);state.local=true;state.loaded=true;carregarLocal();render();return;}
    db.collection("marcas").onSnapshot(function(snap){
      var m={};snap.docs.forEach(function(d){var x=d.data();if(x)m[d.id]=x;});state.marks=m;
      state.loaded=true;if(!snap.metadata.fromCache){clearTimeout(timer);state.slow=false;}
      render();if(state.sheet)drawSheet();
    },function(){clearTimeout(timer);state.loaded=true;toast("Não consegui abrir a lista de vocês.");render();});
    db.collection("extras").onSnapshot(function(snap){
      state.extras=snap.docs.map(function(d){return docExtra(d.data()||{});}).filter(function(t){return t.pt&&t.ano;});rebuild();render();
    },function(){});
  }).catch(function(){clearTimeout(timer);state.local=true;state.loaded=true;carregarLocal();render();});
}

/* ---------- Claude ---------- */
var sampleP=null;
function getSample(){if(!sampleP)sampleP=(window.claude&&window.claude.use?Promise.resolve(window.claude.use("sample")):Promise.resolve(null)).catch(function(){return null;});return sampleP;}
function buscarClaude(){
  var a=state.add,q=(a.q||"").trim();if(!q){a.erro="Digite o nome do filme ou série.";drawSheet();return;}
  a.fase="pensando";a.erro="";a.res=null;drawSheet();
  getSample().then(function(sample){
    if(!sample)throw {code:"not_granted"};
    var prompt='Você ajuda a montar um catálogo pessoal de filmes e séries para um casal no Brasil. Pedido: "'+q.replace(/"/g,"'")+'".\n'+
      'Identifique o filme ou série mais provável (pode ser título em português ou original, com ou sem erro de digitação).\n'+
      'Responda só com um objeto JSON neste formato:\n'+
      '{"encontrado":true,"pt":"título oficial no Brasil","original":"título original","ano":2018,"tipo":"f","generos":"TS","duracao":127,"imdb":7.3,"sinopse":"uma frase curta, sem spoiler, até 110 caracteres","diretor":"nome do diretor (se for série, quem criou)","elenco":["ator 1","ator 2","ator 3"]}\n'+
      'diretor: só o nome, sem explicações. elenco: os 3 atores mais relevantes, só os nomes. tipo: "f" para filme, "s" para série. duracao: minutos se for filme, número de temporadas se for série. imdb: nota aproximada do IMDb com uma casa decimal.\n'+
      'generos: letras em ordem de importância, entre T (terror), S (suspense), A (ação), V (aventura), P (policial), C (comédia), F (ficção científica), D (drama), M (fantasia).\n'+
      'Se não reconhecer o título com segurança, responda {"encontrado":false}.';
    return sample.json(prompt,{modelTier:"default"});
  }).then(function(r){
    if(!state.add)return;
    if(!r||r.encontrado===false||!r.pt){a.fase="";a.erro="O Claude não reconheceu esse título. Confira o nome ou tente o título original.";drawSheet();return;}
    var g=String(r.generos||"D").toUpperCase().replace(/[^TSAVPCFDM]/g,"").slice(0,4)||"D";
    var t=mk([String(r.pt).slice(0,120),String(r.original||r.pt).slice(0,120),parseInt(r.ano,10)||0,r.tipo==="s"?"s":"f",g,Math.max(0,parseInt(r.duracao,10)||0),Math.round((Number(r.imdb)||0)*10)/10,String(r.sinopse||"").slice(0,180),String(r.diretor||"").slice(0,120),Array.isArray(r.elenco)?r.elenco.slice(0,4):[]],true);
    if(!t.ano){a.fase="";a.erro="A resposta veio incompleta. Tente de novo.";drawSheet();return;}
    a.fase="";a.res=t;drawSheet();
  }).catch(function(e){
    if(!state.add)return;a.fase="";
    var c=e&&e.code;
    a.erro=c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled"||c==="not_declared"?"Este app não tem permissão para usar o Claude aqui. Abram pelo app do Claude, com a conta de vocês, e permitam quando ele pedir.":
      c==="rate_limited"?"Muitos pedidos seguidos. Esperem um pouco e tentem de novo.":
      c==="invalid_json"?"A resposta veio num formato estranho. Tentem de novo.":"Não consegui falar com o Claude agora. Tentem de novo.";
    drawSheet();});
}
function salvarExtra(){
  var t=state.add&&state.add.res;if(!t)return;t.criado=new Date().toISOString();
  state.extras=state.extras.filter(function(x){return x.id!==t.id;}).concat([t]);rebuild();
  if(db){db.collection("extras").doc(t.id).set(extraDoc(t)).catch(function(){toast("Não consegui salvar o título. Confiram a internet.");});}else salvarLocal();
  state.add=null;state.sheet=t.id;setMark(t.id,{s:"quero"});drawSheet();toast("Adicionado à nossa lista");}
function removerExtra(id){
  state.extras=state.extras.filter(function(x){return x.id!==id;});rebuild();
  if(db)db.collection("extras").doc(id).delete().catch(function(){});else salvarLocal();
  if(state.marks[id])setMark(id,{s:"",nota:0,onde:"",temp:0,ep:0});
  closeSheet();render();toast("Tirado do catálogo");}

/* ---------- desenho geral ---------- */
var raf=0;
function render(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;draw();});}
function draw(){
  var main=$("#main"),rails={};
  $$(".rail",main).forEach(function(r){rails[r.getAttribute("data-rail")]=r.scrollLeft;});
  var act=document.activeElement,actId=act&&act.id&&main.contains(act)?act.id:null,sel=actId&&act.selectionStart!=null?[act.selectionStart,act.selectionEnd]:null;
  $$(".tab").forEach(function(b){if(b.getAttribute("data-go")===state.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  var nq=Object.keys(state.marks).filter(function(id){return state.marks[id].s==="quero";}).length;
  $("#sub").textContent=ALL.length+" títulos"+(nq?" · "+nq+" na fila":"");
  var h=state.tab==="buscar"?vBuscar():state.tab==="sortear"?vSortear():state.tab==="lista"?vLista():vInicio();
  if(state.local&&state.tab==="lista")h='<div class="banner">'+(SEMCLAUDE?'A lista fica salva neste celular, neste navegador. Se limpar os dados do navegador, ela se perde.':'Abram pelo app do Claude, com a conta de vocês, para a lista ficar salva na nuvem. Aqui ela fica só neste aparelho.')+'</div>'+h;
  main.innerHTML='<div class="view">'+h+'</div>';
  if(state.tab==="buscar")drawBres();
  $$(".rail",main).forEach(function(r){var k=r.getAttribute("data-rail");if(rails[k])r.scrollLeft=rails[k];});
  if(actId){var el=document.getElementById(actId);if(el){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
}
function go(tab){if(["inicio","buscar","sortear","lista"].indexOf(tab)<0)tab="inicio";if(state.tab!==tab){state.tab=tab;render();window.scrollTo(0,0);}if(location.hash.slice(1)!==tab){try{history.replaceState(null,"","#"+tab);}catch(e){location.hash=tab;}}}
var tt=0;function toast(msg){var t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},2600);}
function toggleArr(arr,v){var i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);}

document.addEventListener("click",function(e){
  var el=e.target.closest("button,[data-open],[data-close]");if(!el)return;
  var d=el.dataset,b=state.busca,o=state.sorte;
  if(d.close!==undefined){closeSheet();return;}
  if(d.ep1){e.stopPropagation();var m=mark(d.ep1);setMark(d.ep1,{ep:(m.ep||1)+1,temp:m.temp||1});toast("T"+(m.temp||1)+" · E"+((m.ep||1)+1));return;}
  if(d.open){openSheet(d.open);return;}
  if(d.go){go(d.go);return;}
  if(d.more){var p=d.more.split(":");
    if(p[0]==="lista"){state.lista=p[1];go("lista");return;}
    b.q="";b.gen=[];b.tipo="";b.lim=60;b.ord="nota";
    if(p[0]==="gen"){b.gen=[p[1]];b.tipo="f";}else if(p[0]==="tipo")b.tipo=p[1];
    state.tab="";go("buscar");return;}
  if(d.bt!==undefined){b.tipo=d.bt;b.lim=60;render();return;}
  if(d.bg){toggleArr(b.gen,d.bg);b.lim=60;render();return;}
  if(d.bo){b.ord=d.bo;render();return;}
  if(d.bh){b.esconder=!b.esconder;render();return;}
  if(d.so){o.origem=d.so;render();return;}
  if(d.st2!==undefined){o.tipo=d.st2;render();return;}
  if(d.sg){toggleArr(o.gen,d.sg);render();return;}
  if(d.sd!==undefined){o.dur=d.sd;render();return;}
  if(d.sn!==undefined){o.nota=Number(d.sn);render();return;}
  if(d.lista){state.lista=d.lista;render();return;}
  if(d.st&&state.sheet){var cur=st(state.sheet),nv=cur===d.st?"":d.st,pt={s:nv};
    if(nv==="assistindo"&&!mark(state.sheet).temp){pt.temp=1;pt.ep=1;}
    setMark(state.sheet,pt);
    if(nv==="visto")toast("Marcado como visto. Que nota vocês dão?");else if(nv==="quero")toast("Na nossa lista");else if(nv==="nao")toast("Não vai mais aparecer nas sugestões");
    return;}
  if(d.nota&&state.sheet){var n=Number(d.nota),mm=mark(state.sheet),pt2={nota:mm.nota===n?0:n};if(!mm.s&&pt2.nota)pt2.s="visto";setMark(state.sheet,pt2);return;}
  if(d.tp&&state.sheet){var m2=mark(state.sheet),tp=Math.max(1,(m2.temp||1)+Number(d.tp));setMark(state.sheet,{temp:tp,ep:Number(d.tp)>0?1:(m2.ep||1)});return;}
  if(d.epd&&state.sheet){var m3=mark(state.sheet);setMark(state.sheet,{ep:Math.max(1,(m3.ep||1)+Number(d.epd)),temp:m3.temp||1});return;}
  switch(d.act){
    case "quero":var id=d.id,s0=st(id);setMark(id,{s:s0==="quero"?"":"quero"});toast(s0==="quero"?"Tirado da lista":"Na nossa lista");break;
    case "compartilhar":compartilharLista();break;
    case "outra":state.sug++;render();break;
    case "sortear":sortear();break;
    case "mais":b.lim+=60;drawBres();break;
    case "add":openAdd(b.q);break;
    case "addgo":var q=$("#addq");if(q)state.add.q=q.value;buscarClaude();break;
    case "addsave":salvarExtra();break;
    case "rmextra":if(state.sheet)removerExtra(state.sheet);break;
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){state.busca.q=e.target.value;state.busca.lim=60;drawBres();}
  else if(e.target.id==="addq"&&state.add){state.add.q=e.target.value;}
});
document.addEventListener("change",function(e){
  if(e.target.hasAttribute("data-onde")&&state.sheet){var v=e.target.value.trim().slice(0,60);if(v!==(mark(state.sheet).onde||""))setMark(state.sheet,{onde:v});}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&!$("#sheet").hidden){closeSheet();return;}
  if(e.key==="Enter"&&e.target.id==="addq"){e.preventDefault();state.add.q=e.target.value;buscarClaude();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("lrow")){e.preventDefault();openSheet(e.target.getAttribute("data-open"));}
});
window.addEventListener("hashchange",function(){go(location.hash.slice(1));});
state.tab=["inicio","buscar","sortear","lista"].indexOf(location.hash.slice(1))>=0?location.hash.slice(1):"inicio";
draw();
iniciar();
})();
</script>
